<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Manage Assignments</title>

</head>


<body>


<h1>Manage Assignments</h1>


<a href="/add-assignment">
    Add New Assignment
</a>


<br><br>


<table border="1">


<tr>

    <th>ID</th>
    <th>Title</th>
    <th>Course</th>
    <th>Description</th>
    <th>Due Date</th>
    <th>Action</th>

</tr>



<tr th:each="assignment : ${assignments}">


    <td th:text="${assignment.id}"></td>


    <td th:text="${assignment.title}"></td>


    <td th:text="${assignment.course}"></td>


    <td th:text="${assignment.description}"></td>


    <td th:text="${assignment.dueDate}"></td>


    <td>

        <a th:href="@{/delete-assignment/{id}(id=${assignment.id})}">
            Delete
        </a>

    </td>


</tr>


</table>


</body>
</html>
