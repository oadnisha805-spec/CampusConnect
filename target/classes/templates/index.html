<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>CampusConnect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container py-5">

    <div class="row align-items-center">

        <!-- Left Side -->
        <div class="col-lg-6">

            <h1 class="display-4 fw-bold text-primary">

                CampusConnect

            </h1>

            <h3 class="mb-4">

                Smart University Management System

            </h3>

            <p class="lead">

                CampusConnect is a modern university management platform
                that helps students, faculty, and administrators manage
                academic activities efficiently.

            </p>

            <div class="mt-4">

                <a th:href="@{/login}" class="btn btn-primary btn-lg me-3">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </a>

                <a th:href="@{/register}" class="btn btn-outline-primary btn-lg">

                    <i class="bi bi-person-plus-fill"></i>

                    Register

                </a>

            </div>

        </div>

        <!-- Right Side -->
        <div class="col-lg-6 text-center">

       <img th:src="@{/images/campus.png}"
     class="img-fluid rounded shadow"
     alt="Campus Image">
        </div>

    </div>

</div>

</body>

</html>
