<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Add Student</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap');

        *{ box-sizing:border-box; }
        html,body{ margin:0; min-height:100%; }
        body{ font-family:'Inter', sans-serif; background:#E9EDFB; padding:24px; color:#1B2340; }

        .shell{
            max-width:1280px; margin:0 auto; background:#fff; border-radius:28px;
            box-shadow:0 20px 60px rgba(11,47,107,0.12);
            display:grid; grid-template-columns:250px 1fr; overflow:hidden;
            min-height:calc(100vh - 48px);
        }
        @media (max-width:900px){ .shell{ grid-template-columns:1fr; } .sidebar{ display:none; } }

        .sidebar{
            background:linear-gradient(160deg, #2F6BFF 0%, #0B2F6B 100%);
            color:#fff; padding:28px 18px; display:flex; flex-direction:column; gap:26px;
        }
        .brand{ display:flex; align-items:center; gap:10px; padding:0 8px; }
        .brand svg{ width:28px; height:28px; }
        .brand span{ font-family:'Poppins', sans-serif; font-weight:600; font-size:1.02rem; }

        .nav-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
        .nav-list a{
            display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px;
            font-size:0.88rem; font-weight:500; color:#CBD8FF; text-decoration:none;
            transition:background .15s, color .15s;
        }
        .nav-list a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
        .nav-list a.active{ background:#fff; color:#0B2F6B; font-weight:600; }

        .sidebar-foot{ margin-top:auto; }
        .sidebar-foot a{
            display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px;
            font-size:0.88rem; font-weight:500; color:#FFC9C0; text-decoration:none;
        }
        .sidebar-foot a:hover{ background:rgba(255,255,255,0.08); }

        .main{ display:flex; flex-direction:column; min-width:0; }
        .topbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 34px 20px; }
        .topbar h1{ font-family:'Poppins', sans-serif; font-size:1.35rem; font-weight:700; margin:0; color:#0B2F6B; }
        .topbar p{ margin:3px 0 0; font-size:0.84rem; color:#8791A8; }
        .avatar{
            width:38px; height:38px; border-radius:50%;
            background:linear-gradient(135deg, #2F6BFF, #0B2F6B); color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:0.8rem;
        }

        .content{ padding:8px 34px 34px; }

        .page-header{ margin-bottom:18px; }
        .page-header h2{ font-family:'Poppins', sans-serif; font-size:1.1rem; font-weight:700; color:#0B2F6B; margin:0; }
        .page-header p{ color:#8791A8; font-size:0.84rem; margin:3px 0 0; }

        .form-layout{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
        @media (max-width:820px){ .form-layout{ grid-template-columns:1fr; } }

        .form-card{ background:#F8F9FE; border-radius:20px; padding:26px 28px; }
        .form-group{ margin-bottom:16px; }
        .form-group label{ display:block; font-size:0.8rem; font-weight:600; color:#334066; margin-bottom:6px; }
        .form-control{
            width:100%; border:1.5px solid #E3E7F1; border-radius:10px; padding:10px 14px;
            font-size:0.92rem; font-family:'Inter', sans-serif; color:#1B2340; background:#fff;
            transition:border-color .15s, box-shadow .15s;
        }
        .form-control:focus{ outline:0; border-color:#2F6BFF; box-shadow:0 0 0 3px rgba(47,107,255,0.12); }

        .form-actions{ display:flex; gap:12px; margin-top:8px; }
        .btn-primary{
            display:inline-flex; align-items:center; gap:8px;
            background:linear-gradient(135deg, #2F6BFF, #0B2F6B); color:#fff;
            border:0; border-radius:10px; padding:11px 20px;
            font-size:0.9rem; font-weight:600; cursor:pointer;
        }
        .btn-primary:hover{ opacity:0.92; }
        .btn-secondary{
            background:#fff; color:#5B6072; border:1.5px solid #E3E7F1; border-radius:10px;
            padding:11px 20px; font-size:0.9rem; font-weight:600; text-decoration:none;
        }
        .btn-secondary:hover{ background:#F7F8FB; }

        .live-badge{
            display:inline-flex; align-items:center; gap:7px;
            font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.08em;
            text-transform:uppercase; color:#2F6BFF; background:#E5EDFF;
            border:1px solid #C8D9FF; padding:5px 11px; border-radius:999px; margin-bottom:14px;
        }
        .live-badge .dot{ width:5px; height:5px; border-radius:50%; background:#1E9E63; box-shadow:0 0 0 3px rgba(30,158,99,0.2); }

        .id-card{
            border-radius:18px; overflow:hidden;
            background:linear-gradient(160deg, #2F6BFF, #0B2F6B); color:#fff;
        }
        .id-card-band{ padding:16px 20px; display:flex; align-items:center; gap:9px; border-bottom:1px dashed rgba(255,255,255,0.25); }
        .id-card-band svg{ width:22px; height:22px; }
        .id-card-band span{ font-family:'Poppins', sans-serif; font-weight:600; font-size:0.9rem; }
        .id-card-body{ padding:26px 22px 22px; text-align:center; }
        .id-avatar{
            width:70px; height:70px; margin:0 auto 14px; border-radius:50%;
            background:rgba(255,255,255,0.1); border:2px solid #BFD1FF;
            display:flex; align-items:center; justify-content:center;
            font-family:'Poppins', sans-serif; font-weight:700; font-size:1.4rem;
        }
        .id-name{ font-family:'Poppins', sans-serif; font-size:1.1rem; font-weight:600; min-height:1.4em; }
        .id-dept{
            display:inline-block; margin-top:9px; padding:4px 13px; border-radius:999px;
            background:rgba(255,255,255,0.14); color:#DCE9FF;
            font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:0.06em;
            text-transform:uppercase; min-height:1.2em;
        }
        .id-meta{
            margin-top:20px; padding-top:14px; border-top:1px dashed rgba(255,255,255,0.22);
            font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color:#C7D6F5;
            display:flex; justify-content:space-between;
        }
    </style>
</head>

<body>

<div class="shell">

    <aside class="sidebar">
        <div class="brand">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#fff"/>
                <path d="M10 16 V26 C10 29 14.5 32 20 32 C25.5 32 30 29 30 26 V16 L20 21 Z" fill="#BFD1FF"/>
            </svg>
            <span>CampusConnect</span>
        </div>
        <ul class="nav-list">
            <li><a th:href="@{/admin-dashboard}"><i class="bi bi-grid"></i> Dashboard</a></li>
            <li><a th:href="@{/students}" class="active"><i class="bi bi-people-fill"></i> Students</a></li>
            <li><a th:href="@{/faculty}"><i class="bi bi-person-badge-fill"></i> Faculty</a></li>
            <li><a th:href="@{/courses}"><i class="bi bi-book-fill"></i> Courses</a></li>
            <li><a th:href="@{/notices}"><i class="bi bi-megaphone-fill"></i> Notices</a></li>
            <li><a th:href="@{/fees}"><i class="bi bi-cash-coin"></i> Fees</a></li>
        </ul>
        <div class="sidebar-foot">
            <a th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </aside>

    <div class="main">

        <div class="topbar">
            <div>
                <h1>Add Student</h1>
                <p>Smart University Management System</p>
            </div>
            <div class="avatar">AD</div>
        </div>

        <div class="content">

            <div class="page-header">
                <h2>Add student</h2>
                <p>Register a new student account.</p>
            </div>

            <div class="form-layout">

                <div class="form-card">
                    <form th:action="@{/save-student}" th:object="${student}" method="post">

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input id="name" type="text" th:field="*{name}" class="form-control"
                                   oninput="updateIdCard()" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="department">Department</label>
                            <input id="department" type="text" th:field="*{department}" class="form-control"
                                   oninput="updateIdCard()" required>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">
                                <i class="bi bi-check-lg"></i> Save student
                            </button>
                            <a th:href="@{/students}" class="btn-secondary">Cancel</a>
                        </div>

                    </form>
                </div>

                <div>
                    <span class="live-badge"><span class="dot"></span> Live preview</span>

                    <div class="id-card">
                        <div class="id-card-band">
                            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#fff"/>
                                <path d="M10 16 V26 C10 29 14.5 32 20 32 C25.5 32 30 29 30 26 V16 L20 21 Z" fill="#BFD1FF"/>
                            </svg>
                            <span>CampusConnect</span>
                        </div>
                        <div class="id-card-body">
                            <div class="id-avatar" id="idAvatar">—</div>
                            <div class="id-name" id="idName">New student</div>
                            <div class="id-dept" id="idDept">Department</div>
                            <div class="id-meta">
                                <span>Student ID</span>
                                <span>Pending</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script>
    function updateIdCard() {
        var nameVal = document.getElementById('name').value.trim();
        var deptVal = document.getElementById('department').value.trim();

        document.getElementById('idName').textContent = nameVal || 'New student';
        document.getElementById('idDept').textContent = deptVal || 'Department';

        var avatarEl = document.getElementById('idAvatar');
        if (nameVal) {
            var parts = nameVal.split(/\s+/).filter(Boolean);
            var initials = parts.slice(0, 2).map(function (p) { return p[0].toUpperCase(); }).join('');
            avatarEl.textContent = initials || '—';
        } else {
            avatarEl.textContent = '—';
        }
    }
</script>

</body>

</html>
