<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - My Profile</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap');

        *{ box-sizing:border-box; }
        html,body{ margin:0; min-height:100%; }
        body{ font-family:'Inter', sans-serif; background:#EAF2FE; padding:24px; color:#0B2340; }

        .shell{
            max-width:1280px; margin:0 auto; background:#fff; border-radius:28px;
            box-shadow:0 20px 60px rgba(11,59,122,0.14);
            display:grid; grid-template-columns:250px 1fr; overflow:hidden;
            min-height:calc(100vh - 48px);
        }
        @media (max-width:900px){ .shell{ grid-template-columns:1fr; } .sidebar{ display:none; } }

        .sidebar{
            background:linear-gradient(160deg, #3B93FF 0%, #123B7A 100%);
            color:#fff; padding:28px 18px; display:flex; flex-direction:column; gap:26px;
        }
        .brand{ display:flex; align-items:center; gap:10px; padding:0 8px; }
        .brand svg{ width:28px; height:28px; }
        .brand span{ font-family:'Poppins', sans-serif; font-weight:600; font-size:1.02rem; }

        .nav-group-label{
            font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.1em;
            text-transform:uppercase; color:#AFCBFA; padding:0 14px; margin-bottom:6px;
        }
        .nav-list{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:4px; }
        .nav-list a{
            display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px;
            font-size:0.88rem; font-weight:500; color:#D3E4FF; text-decoration:none;
            transition:background .15s, color .15s;
        }
        .nav-list a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
        .nav-list a.active{ background:#fff; color:#123B7A; font-weight:600; }

        .sidebar-foot{ margin-top:auto; }
        .sidebar-foot a{
            display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px;
            font-size:0.88rem; font-weight:500; color:#FFC9C0; text-decoration:none;
        }
        .sidebar-foot a:hover{ background:rgba(255,255,255,0.08); }

        .main{ display:flex; flex-direction:column; min-width:0; }
        .topbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 34px 20px; }
        .topbar h1{ font-family:'Poppins', sans-serif; font-size:1.35rem; font-weight:700; margin:0; color:#123B7A; }
        .topbar p{ margin:3px 0 0; font-size:0.84rem; color:#7C8CAE; }
        .avatar{
            width:38px; height:38px; border-radius:50%;
            background:linear-gradient(135deg, #3B93FF, #123B7A); color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:0.8rem;
        }

        .content{ padding:8px 34px 34px; }

        .form-layout{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
        @media (max-width:820px){ .form-layout{ grid-template-columns:1fr; } }

        .detail-card{ background:#F2F7FF; border-radius:20px; padding:26px 28px; }
        .detail-list{ list-style:none; margin:0; padding:0; }
        .detail-list li{ display:flex; justify-content:space-between; padding:13px 0; border-bottom:1px solid #E0ECFF; font-size:0.9rem; }
        .detail-list li:last-child{ border-bottom:none; }
        .detail-list .label{ color:#7C8CAE; font-weight:500; }
        .detail-list .value{ color:#0B2340; font-weight:600; }

        .id-card{ border-radius:18px; overflow:hidden; background:linear-gradient(160deg, #3B93FF, #123B7A); color:#fff; }
        .id-card-band{ padding:16px 20px; display:flex; align-items:center; gap:9px; border-bottom:1px dashed rgba(255,255,255,0.25); }
        .id-card-band svg{ width:22px; height:22px; }
        .id-card-band span{ font-family:'Poppins', sans-serif; font-weight:600; font-size:0.9rem; }
        .id-card-body{ padding:26px 22px 22px; text-align:center; }
        .id-avatar{
            width:70px; height:70px; margin:0 auto 14px; border-radius:50%;
            background:rgba(255,255,255,0.1); border:2px solid #C9DFFF;
            display:flex; align-items:center; justify-content:center;
            font-family:'Poppins', sans-serif; font-weight:700; font-size:1.4rem;
        }
        .id-name{ font-family:'Poppins', sans-serif; font-size:1.1rem; font-weight:600; }
        .id-dept{
            display:inline-block; margin-top:9px; padding:4px 13px; border-radius:999px;
            background:rgba(255,255,255,0.14); color:#E0ECFF;
            font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase;
        }
        .id-meta{
            margin-top:20px; padding-top:14px; border-top:1px dashed rgba(255,255,255,0.22);
            font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color:#D3E4FF;
            display:flex; justify-content:space-between;
        }

        .action-list{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; margin-top:22px; }
        .action-row{
            display:flex; align-items:center; gap:14px; background:#F2F7FF; border-radius:16px; padding:16px;
            text-decoration:none; transition:background .15s, transform .1s;
        }
        .action-row:hover{ background:#E5F0FF; transform:translateY(-2px); }
        .action-row .icon{
            width:40px; height:40px; flex:none; border-radius:12px; background:#fff;
            display:flex; align-items:center; justify-content:center; color:#3B93FF; font-size:1.05rem;
        }
        .action-row .label{ font-size:0.9rem; font-weight:600; color:#0B2340; }

        .empty-state{ text-align:center; padding:56px 20px; color:#7C8CAE; }
        .empty-state i{ font-size:1.9rem; color:#B6C9EF; display:block; margin-bottom:10px; }
    </style>
</head>

<body>

<div class="shell">

    <aside class="sidebar">
        <div class="brand">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#fff"/>
                <path d="M10 16 V26 C10 29 14.5 32 20 32 C25.5 32 30 29 30 26 V16 L20 21 Z" fill="#D3E4FF"/>
            </svg>
            <span>CampusConnect</span>
        </div>

        <div>
            <p class="nav-group-label">Overview</p>
            <ul class="nav-list">
                <li><a th:href="@{/student-dashboard}"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a th:href="@{/profile}" class="active"><i class="bi bi-person"></i> Profile</a></li>
            </ul>
        </div>

        <div>
            <p class="nav-group-label">Academics</p>
            <ul class="nav-list">
                <li><a th:href="@{/courses}"><i class="bi bi-journal-bookmark"></i> Courses</a></li>
                <li><a th:href="@{/assignments}"><i class="bi bi-pencil-square"></i> Assignments</a></li>
                <li><a th:href="@{/attendance}"><i class="bi bi-calendar-check"></i> Attendance</a></li>
                <li><a th:href="@{/notices}"><i class="bi bi-megaphone"></i> Notices</a></li>
                <li><a th:href="@{/my-fees}"><i class="bi bi-cash-coin"></i> My Fees</a></li>
            </ul>
        </div>

        <div class="sidebar-foot">
            <a th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </aside>

    <div class="main">

        <div class="topbar">
            <div>
                <h1>My Profile</h1>
                <p>Your account details</p>
            </div>
            <div class="avatar">ST</div>
        </div>

        <div class="content">

            <div class="empty-state" th:if="${profileMissing}">
                <i class="bi bi-person-x"></i>
                <p>No profile record found yet.</p>
            </div>

            <div th:unless="${profileMissing}">

                <div class="form-layout">

                    <div class="detail-card">
                        <ul class="detail-list">
                            <li><span class="label">Name</span><span class="value" th:text="${student.name}"></span></li>
                            <li><span class="label">Email</span><span class="value" th:text="${student.email}"></span></li>
                            <li><span class="label">Department</span><span class="value" th:text="${student.department}"></span></li>
                        </ul>
                    </div>

                    <div class="id-card">
                        <div class="id-card-band">
                            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#fff"/>
                                <path d="M10 16 V26 C10 29 14.5 32 20 32 C25.5 32 30 29 30 26 V16 L20 21 Z" fill="#D3E4FF"/>
                            </svg>
                            <span>CampusConnect</span>
                        </div>
                        <div class="id-card-body">
                            <div class="id-avatar" th:text="${student.name != null and student.name.length() > 0 ? student.name.substring(0,1).toUpperCase() : '?'}"></div>
                            <div class="id-name" th:text="${student.name}"></div>
                            <div class="id-dept" th:text="${student.department}"></div>
                            <div class="id-meta">
                                <span>Student</span>
                                <span>Active</span>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="action-list">
                    <a th:href="@{/courses}" class="action-row">
                        <div class="icon"><i class="bi bi-journal-bookmark"></i></div>
                        <div class="label">My courses</div>
                    </a>
                    <a th:href="@{/notices}" class="action-row">
                        <div class="icon"><i class="bi bi-megaphone"></i></div>
                        <div class="label">Notices</div>
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
