<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - My Fees</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap');

        *{ box-sizing:border-box; }
        html,body{ margin:0; min-height:100%; }
        body{
            font-family:'Inter', sans-serif;
            background:#EAF2FE;
            padding:24px;
            color:#0B2340;
        }

        .shell{
            max-width:1280px;
            margin:0 auto;
            background:#fff;
            border-radius:28px;
            box-shadow:0 20px 60px rgba(11,59,122,0.14);
            display:grid;
            grid-template-columns:250px 1fr;
            overflow:hidden;
            min-height:calc(100vh - 48px);
        }
        @media (max-width:900px){
            .shell{ grid-template-columns:1fr; }
            .sidebar{ display:none; }
        }

        .sidebar{
            background:linear-gradient(160deg, #3B93FF 0%, #123B7A 100%);
            color:#fff;
            padding:28px 18px;
            display:flex;
            flex-direction:column;
            gap:26px;
        }
        .brand{ display:flex; align-items:center; gap:10px; padding:0 8px; }
        .brand svg{ width:28px; height:28px; }
        .brand span{ font-family:'Poppins', sans-serif; font-weight:600; font-size:1.02rem; }

        .nav-group-label{
            font-family:'IBM Plex Mono', monospace;
            font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
            color:#AFCBFA; padding:0 14px; margin-bottom:6px;
        }
        .nav-list{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:4px; }
        .nav-list a{
            display:flex; align-items:center; gap:10px;
            padding:11px 14px;
            border-radius:12px;
            font-size:0.88rem;
            font-weight:500;
            color:#D3E4FF;
            text-decoration:none;
            transition:background .15s, color .15s;
        }
        .nav-list a:hover{ background:rgba(255,255,255,0.08); color:#fff; }
        .nav-list a.active{ background:#fff; color:#123B7A; font-weight:600; }

        .sidebar-foot{ margin-top:auto; }
        .sidebar-foot a{
            display:flex; align-items:center; gap:10px;
            padding:11px 14px;
            border-radius:12px;
            font-size:0.88rem;
            font-weight:500;
            color:#FFC9C0;
            text-decoration:none;
        }
        .sidebar-foot a:hover{ background:rgba(255,255,255,0.08); }

        .main{ display:flex; flex-direction:column; min-width:0; }

        .topbar{
            display:flex; align-items:center; justify-content:space-between;
            padding:26px 34px 20px;
        }
        .topbar h1{ font-family:'Poppins', sans-serif; font-size:1.35rem; font-weight:700; margin:0; color:#123B7A; }
        .topbar p{ margin:3px 0 0; font-size:0.84rem; color:#7C8CAE; }

        .avatar{
            width:38px; height:38px; border-radius:50%;
            background:linear-gradient(135deg, #3B93FF, #123B7A);
            color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-family:'IBM Plex Mono', monospace;
            font-weight:600; font-size:0.8rem;
        }

        .content{ padding:8px 34px 34px; }

        .table-card{
            background:#F2F7FF;
            border-radius:20px;
            overflow:hidden;
        }
        table.data-table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
        .data-table th{
            text-align:left;
            background:#E5F0FF;
            color:#4E6A9E;
            font-size:0.7rem;
            text-transform:uppercase;
            letter-spacing:0.05em;
            font-weight:600;
            padding:14px 20px;
        }
        .data-table td{ padding:14px 20px; border-top:1px solid #E5F0FF; }

        .status-pill{
            display:inline-block;
            padding:4px 12px;
            border-radius:999px;
            font-size:0.72rem;
            font-weight:600;
        }
        .status-paid{ background:#D9F5E9; color:#1E9E63; }
        .status-unpaid{ background:#FEE2E0; color:#D3453B; }

        .empty-state{ text-align:center; padding:56px 20px; color:#7C8CAE; }
        .empty-state i{ font-size:1.9rem; color:#B6C9EF; display:block; margin-bottom:10px; }
    </style>
</head>

<body>

<div class="shell">

    <aside class="sidebar">

        <div class="brand">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#fff"/>
                <path d="M10 16 V26 C10 29 14.5 32 20 32 C25.5 32 30 29 30 26 V16 L20 21 Z" fill="#D3E4FF"/>
            </svg>
            <span>CampusConnect</span>
        </div>

        <div>
            <p class="nav-group-label">Overview</p>
            <ul class="nav-list">
                <li><a th:href="@{/student-dashboard}"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a th:href="@{/profile}"><i class="bi bi-person"></i> Profile</a></li>
            </ul>
        </div>

        <div>
            <p class="nav-group-label">Academics</p>
            <ul class="nav-list">
                <li><a th:href="@{/courses}"><i class="bi bi-journal-bookmark"></i> Courses</a></li>
                <li><a th:href="@{/assignments}"><i class="bi bi-pencil-square"></i> Assignments</a></li>
                <li><a th:href="@{/attendance}"><i class="bi bi-calendar-check"></i> Attendance</a></li>
                <li><a th:href="@{/notices}"><i class="bi bi-megaphone"></i> Notices</a></li>
                <li><a th:href="@{/my-fees}" class="active"><i class="bi bi-cash-coin"></i> My Fees</a></li>
            </ul>
        </div>

        <div class="sidebar-foot">
            <a th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>

    </aside>

    <div class="main">

        <div class="topbar">
            <div>
                <h1>My Fees</h1>
                <p>Your fee records for this program.</p>
            </div>
            <div class="avatar">ST</div>
        </div>

        <div class="content">

            <div class="empty-state" th:if="${feesMissing}">
                <i class="bi bi-person-x"></i>
                <p>No student record linked to this account yet.</p>
            </div>

            <div th:unless="${feesMissing}">

                <div class="table-card" th:if="${not #lists.isEmpty(myFees)}">
                    <table class="data-table">
                        <tr>
                            <th>Semester</th>
                            <th>Amount</th>
                            <th>Due date</th>
                            <th>Status</th>
                        </tr>
                        <tr th:each="fee : ${myFees}">
                            <td th:text="${fee.semester}"></td>
                            <td th:text="${fee.amount}"></td>
                            <td th:text="${fee.dueDate}"></td>
                            <td>
                                <span class="status-pill"
                                      th:classappend="${fee.status == 'Paid'} ? 'status-paid' : 'status-unpaid'"
                                      th:text="${fee.status}"></span>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="table-card" th:if="${#lists.isEmpty(myFees)}">
                    <div class="empty-state">
                        <i class="bi bi-cash-coin"></i>
                        <p>No fee records yet.</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
