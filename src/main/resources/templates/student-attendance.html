<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Attendance</title>

</head>


<body>


<h1>My Attendance</h1>


<table border="1">


<tr>

    <th>Course</th>
    <th>Date</th>
    <th>Status</th>

</tr>



<tr th:each="attendance : ${attendances}">


    <td th:text="${attendance.course}"></td>


    <td th:text="${attendance.date}"></td>


    <td th:text="${attendance.status}"></td>


</tr>


</table>


</body>
</html>
